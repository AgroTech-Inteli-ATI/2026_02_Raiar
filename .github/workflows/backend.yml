name: Backend

on:
  push:
    paths: ['src/backend/**', 'src/database/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['src/backend/**', 'src/database/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: raiar_backend_test
          POSTGRES_USER: raiar
          POSTGRES_PASSWORD: raiar_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raiar -d raiar_backend_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    env:
      TEST_DATABASE_URL: postgresql://raiar:raiar_ci@127.0.0.1:5432/raiar_backend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
