[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "raiar-vision"
version = "0.1.0"
description = "Detecção de aves visíveis e distribuição por nível do Jump Start."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ultralytics>=8.3.162,<9",
  "huggingface-hub>=0.27,<2",
  "opencv-python>=4.10,<5",
  "PyYAML>=6.0.2,<7",
  "psutil>=5.9,<8",
  "requests>=2.32,<3",
  "sahi>=0.12.8,<1",
]

[project.scripts]
raiar-vision = "raiar_vision.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/raiar_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
