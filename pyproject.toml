[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "raiar-vision"
version = "0.1.0"
description = "Detecção de aves visíveis e distribuição por nível do Jump Start."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ultralytics>=8.3.162,<9",
  "huggingface-hub>=0.27,<2",
  "opencv-python>=4.10,<5",
  "PyYAML>=6.0.2,<7",
  "psutil>=5.9,<8",
  "requests>=2.32,<3",
  "sahi>=0.12.8,<1",
]

[project.scripts]
chicken-yolo = "chicken_yolo.cli:main"
raiar-vision = "chicken_yolo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebooks = [
  "ipykernel>=6.29,<8",
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chicken_yolo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
