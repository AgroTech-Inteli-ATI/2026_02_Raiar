services:
  chicken-yolo:
    image: raiar/chicken-yolo:local
    platform: linux/arm64/v8
    build:
      context: .
      dockerfile: docker/chicken-yolo/Dockerfile
    init: true
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./src/chicken_yolo/models/pretrained:/app/src/chicken_yolo/models/pretrained
      - ./src/chicken_yolo/models/trained:/app/src/chicken_yolo/models/trained
      - chicken-yolo-cache:/app/.cache

  raiarnet:
    image: raiar/raiarnet:local
    platform: linux/arm64/v8
    build:
      context: .
      dockerfile: docker/raiarnet/Dockerfile
    init: true
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      RAIARNET_NUM_THREADS: "4"
    volumes:
      - ./data:/app/data:ro
      - ./src/raiarnet/runs:/app/src/raiarnet/runs:ro
      - ./outputs:/app/outputs

volumes:
  chicken-yolo-cache:
