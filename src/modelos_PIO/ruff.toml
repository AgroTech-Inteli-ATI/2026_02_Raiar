# Lint dos scripts de pós-processamento do YOLOPIO (rodados a partir desta pasta).
line-length = 110
target-version = "py311"
extend-exclude = ["*.ipynb", "midias", "resultados"]

[lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B023"]  # scripts de experimento: linhas longas de relatório; lambdas chamadas na hora

[lint.isort]
known-first-party = ["pos_processamento", "rodar_experimentos", "avaliar_video_inteiro"]
