services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: raiar
      POSTGRES_USER: raiar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raiar_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiar -d raiar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
