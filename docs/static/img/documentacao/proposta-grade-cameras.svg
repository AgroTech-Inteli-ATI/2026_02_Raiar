<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" role="img" aria-labelledby="title desc"><title id="title">Proposta de grade de distribuição por câmera</title><desc id="desc">Três cartões de câmera mostram campos previstos: média de aves visíveis, número de análises válidas e horário. Um cartão exemplifica a falta de dados. Não há valores reais, planta física ou classificação validada.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#254d69" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1050" height="520" rx="20" fill="#fffdf7"/><text x="36" y="45" font-size="28" fill="#254d69" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Distribuição por câmera</tspan></text><rect x="36" y="68" width="432" height="40" rx="9" fill="#fff2c7" stroke="#b28b16" stroke-width="2"/><text x="52" y="95" font-size="18" fill="#254d69" font-weight="700" text-anchor="start"><tspan x="52" dy="0">PROPOSTA • SEM DADOS REAIS</tspan></text><text x="36" y="147" font-size="19" fill="#526777" font-weight="400" text-anchor="start"><tspan x="36" dy="0">Grade de consulta: a posição dos cartões não corresponde à planta do aviário.</tspan></text><rect x="36" y="184" width="303" height="224" rx="16" fill="#fff" stroke="#ccd8dd" stroke-width="2"/><text x="58" y="226" font-size="25" fill="#254d69" font-weight="700" text-anchor="start"><tspan x="58" dy="0">Câmera A</tspan></text><text x="58" y="270" font-size="18" fill="#212b36" font-weight="400" text-anchor="start"><tspan x="58" dy="0">Média de aves visíveis</tspan><tspan x="58" dy="25.2">Quantidade de análises</tspan><tspan x="58" dy="25.2">Horário mais recente</tspan></text><rect x="54" y="352" width="267" height="36" rx="8" fill="#edf3f5" stroke="#ccd8dd" stroke-width="2"/><text x="65" y="376" font-size="16" fill="#526777" font-weight="400" text-anchor="start"><tspan x="65" dy="0">Análises válidas no período</tspan></text><rect x="373" y="184" width="303" height="224" rx="16" fill="#fff" stroke="#ccd8dd" stroke-width="2"/><text x="395" y="226" font-size="25" fill="#254d69" font-weight="700" text-anchor="start"><tspan x="395" dy="0">Câmera B</tspan></text><text x="395" y="270" font-size="18" fill="#212b36" font-weight="400" text-anchor="start"><tspan x="395" dy="0">Média de aves visíveis</tspan><tspan x="395" dy="25.2">Quantidade de análises</tspan><tspan x="395" dy="25.2">Horário mais recente</tspan></text><rect x="391" y="352" width="267" height="36" rx="8" fill="#edf3f5" stroke="#ccd8dd" stroke-width="2"/><text x="402" y="376" font-size="16" fill="#526777" font-weight="400" text-anchor="start"><tspan x="402" dy="0">Análises válidas no período</tspan></text><rect x="710" y="184" width="303" height="224" rx="16" fill="#fff" stroke="#ccd8dd" stroke-width="2"/><text x="732" y="226" font-size="25" fill="#254d69" font-weight="700" text-anchor="start"><tspan x="732" dy="0">Câmera C</tspan></text><text x="732" y="270" font-size="18" fill="#212b36" font-weight="400" text-anchor="start"><tspan x="732" dy="0">Média de aves visíveis</tspan><tspan x="732" dy="25.2">Quantidade de análises</tspan><tspan x="732" dy="25.2">Horário mais recente</tspan></text><rect x="728" y="352" width="267" height="36" rx="8" fill="#edf3f5" stroke="#ccd8dd" stroke-width="2"/><text x="739" y="376" font-size="16" fill="#526777" font-weight="400" text-anchor="start"><tspan x="739" dy="0">Sem observação válida</tspan></text><text x="36" y="458" font-size="19" fill="#526777" font-weight="400" text-anchor="start"><tspan x="36" dy="0">A classificação baixa, média ou alta depende de limites acordados e validados.</tspan><tspan x="36" dy="26.599999999999998">A média de aves visíveis não mede densidade física nem bem-estar.</tspan></text></g></svg>