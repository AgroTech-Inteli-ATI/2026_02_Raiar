<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">Da câmera à contagem das aves</title>
<desc id="description">Arquitetura em blocos e ícones: receber imagens, contar aves por nível e guardar resultados. O histórico local pertence ao Chicken-YOLO; acesso ao gravador e plataforma central ainda precisam de validação.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7846a3"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="65" y="62" font-size="46" font-weight="700" fill="#7846a3">Da câmera à contagem das aves</text>
<text x="65" y="107" font-size="24" font-weight="400" fill="#40334b">Arquitetura preliminar · leia da esquerda para a direita e de cima para baixo</text>
<text x="65" y="152" font-size="29" font-weight="700" fill="#7846a3">1. Receber as imagens</text>
<rect x="65" y="180" width="550" height="180" rx="16" fill="#f7f2fc" stroke="#7846a3" stroke-width="2.5" />
<g transform="translate(91,238)" color="#7846a3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="13" width="42" height="30" rx="5"/><circle cx="26" cy="28" r="9"/><path d="M11 13l4-7h15l4 7M47 20l12-7v30L47 36"/></g>
<text x="178" y="237" font-size="28" font-weight="700" fill="#352044">Câmera do aviário</text>
<text x="178" y="284" font-size="23" font-weight="400" fill="#40334b">C1 = CAM 3</text>
<path d="M626 270L673 270" fill="none" stroke="#7846a3" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="685" y="180" width="550" height="180" rx="16" fill="#fff8e9" stroke="#a66b12" stroke-width="2.5" stroke-dasharray="9 6"/>
<g transform="translate(711,238)" color="#a66b12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="50" height="15" rx="3"/><rect x="7" y="25" width="50" height="15" rx="3"/><rect x="7" y="44" width="50" height="15" rx="3"/><path d="M15 13h2m-2 19h2m-2 19h2m25-38h8m-8 19h8m-8 19h8"/></g>
<text x="798" y="237" font-size="28" font-weight="700" fill="#352044">Gravador das câmeras</text>
<text x="798" y="284" font-size="23" font-weight="400" fill="#40334b">Guarda os vídeos</text>
<text x="798" y="315" font-size="23" font-weight="400" fill="#40334b">Acesso USB/rede a confirmar</text>
<path d="M1246 270L1293 270" fill="none" stroke="#7846a3" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="1305" y="180" width="550" height="180" rx="16" fill="#f7f2fc" stroke="#7846a3" stroke-width="2.5" />
<g transform="translate(1331,238)" color="#7846a3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="44" height="42" rx="4"/><path d="M14 5h43v40M15 43l10-13 8 9 8-6M16 23h.1"/><circle cx="16" cy="23" r="3"/></g>
<text x="1418" y="237" font-size="28" font-weight="700" fill="#352044">Vídeos para o projeto</text>
<text x="1418" y="284" font-size="23" font-weight="400" fill="#40334b">Arquivos já recebidos</text>
<text x="1418" y="315" font-size="23" font-weight="400" fill="#40334b">Imagens selecionadas para análise</text>
<path d="M1855 270H1880V400H40V560H63" fill="none" stroke="#7846a3" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="760" y="381" width="400" height="36" fill="white"/>
<text x="785" y="407" font-size="20" font-weight="400" fill="#40334b">Imagens para análise</text>
<text x="65" y="442" font-size="29" font-weight="700" fill="#7846a3">2. Contar as aves por nível</text>
<rect x="65" y="470" width="550" height="180" rx="16" fill="#fff8e9" stroke="#a66b12" stroke-width="2.5" stroke-dasharray="9 6"/>
<g transform="translate(91,528)" color="#a66b12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 27l-5-9 14 3c5-5 13-6 20-2l4-9 8-3 7 4 1 9-6 6c0 17-10 24-25 24-10 0-17-8-18-17zM21 49v10m13-10v10M48 7l-2-5m4 5l3-5M57 15l6 3-6 3"/><circle cx="50" cy="14" r="1.6" fill="currentColor" stroke="none"/></g>
<text x="178" y="527" font-size="28" font-weight="700" fill="#352044">Reconhecer as aves</text>
<text x="178" y="574" font-size="23" font-weight="400" fill="#40334b">Modelos em avaliação:</text>
<text x="178" y="605" font-size="23" font-weight="400" fill="#40334b">RaiarNet ou Chicken-YOLO</text>
<path d="M626 560L673 560" fill="none" stroke="#7846a3" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="685" y="470" width="550" height="180" rx="16" fill="#f7f2fc" stroke="#7846a3" stroke-width="2.5" />
<g transform="translate(711,528)" color="#7846a3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16L32 3l27 13-27 13zM5 30l27 13 27-13M5 44l27 13 27-13"/></g>
<text x="798" y="527" font-size="28" font-weight="700" fill="#352044">Identificar o nível</text>
<text x="798" y="574" font-size="23" font-weight="400" fill="#40334b">N0 Piso · N1 Meio</text>
<text x="798" y="605" font-size="23" font-weight="400" fill="#40334b">N2 Plataforma</text>
<path d="M1246 560L1293 560" fill="none" stroke="#7846a3" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="1305" y="470" width="550" height="180" rx="16" fill="#f7f2fc" stroke="#7846a3" stroke-width="2.5" />
<g transform="translate(1331,528)" color="#7846a3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v52h53M15 48V31h9v17m8 0V20h9v28m8 0V9h9v39"/></g>
<text x="1418" y="527" font-size="28" font-weight="700" fill="#352044">Contar as aves</text>
<text x="1418" y="574" font-size="23" font-weight="400" fill="#40334b">Por nível, câmera e horário</text>
<path d="M1855 560H1880V690H40V850H63" fill="none" stroke="#7846a3" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="760" y="671" width="400" height="36" fill="white"/>
<text x="785" y="697" font-size="20" font-weight="400" fill="#40334b">Contagens do Chicken-YOLO</text>
<text x="65" y="732" font-size="29" font-weight="700" fill="#7846a3">3. Guardar e acompanhar (Chicken-YOLO)</text>
<rect x="65" y="760" width="550" height="180" rx="16" fill="#f7f2fc" stroke="#7846a3" stroke-width="2.5" />
<g transform="translate(91,818)" color="#7846a3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="11" rx="25" ry="9"/><path d="M7 11v40c0 12 50 12 50 0V11M7 27c0 12 50 12 50 0M7 43c0 12 50 12 50 0"/></g>
<text x="178" y="817" font-size="28" font-weight="700" fill="#352044">Salvar as contagens</text>
<text x="178" y="864" font-size="23" font-weight="400" fill="#40334b">Resultados salvos no computador</text>
<path d="M626 850L673 850" fill="none" stroke="#7846a3" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="685" y="760" width="550" height="180" rx="16" fill="#fff8e9" stroke="#a66b12" stroke-width="2.5" stroke-dasharray="9 6"/>
<g transform="translate(711,818)" color="#a66b12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 48H15C-1 46 0 25 15 24 14 6 40 1 48 19c19-1 22 28 4 29h-6M32 58V28m-11 11l11-11 11 11"/></g>
<text x="798" y="817" font-size="28" font-weight="700" fill="#352044">Enviar os resultados</text>
<text x="798" y="864" font-size="23" font-weight="400" fill="#40334b">Envio preparado no protótipo</text>
<text x="798" y="895" font-size="23" font-weight="400" fill="#40334b">Conexão com o painel a validar</text>
<path d="M1246 850L1293 850" fill="none" stroke="#7846a3" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="1305" y="760" width="550" height="180" rx="16" fill="#fff8e9" stroke="#a66b12" stroke-width="2.5" stroke-dasharray="9 6"/>
<g transform="translate(1331,818)" color="#a66b12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="58" height="41" rx="4"/><path d="M24 46v11m16-11v11M16 59h32M14 35V24m13 11V16m13 19V22m12 13V12"/></g>
<text x="1418" y="817" font-size="28" font-weight="700" fill="#352044">Ver gráficos e histórico</text>
<text x="1418" y="864" font-size="23" font-weight="400" fill="#40334b">Plataforma e painel propostos</text>
<path d="M65 985h50" stroke="#7846a3" stroke-width="3"/>
<text x="130" y="992" font-size="21" font-weight="400" fill="#40334b">Etapa disponível ou equipamento existente</text>
<rect x="720" y="970" width="46" height="25" rx="5" fill="#fff8e9" stroke="#a66b12" stroke-width="2" stroke-dasharray="6 4"/>
<text x="783" y="992" font-size="21" font-weight="400" fill="#40334b">Escolha ou integração a validar</text>
<text x="65" y="1045" font-size="22" font-weight="400" fill="#40334b">Testamos com vídeos recebidos. C2 segue em avaliação; acesso ao gravador e uso contínuo na granja precisam de validação.</text>
</g></svg>