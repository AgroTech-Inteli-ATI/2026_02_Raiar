services:
  vision:
    profiles: ["captura"]
    image: raiar/vision:${RAIAR_TAG:-0.1.0}
    build:
      context: .
      dockerfile: sprint-3/docker/chicken-yolo/Dockerfile
      args:
        MODELO: ${MODELO:-coco}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # A captura ao vivo ainda não existe; não reinicie um comando que não consome câmeras.
    restart: "no"
    mem_limit: 2g
    cpus: 3.2
    environment:
      RAIAR_CAMERA_SOURCE: ${RAIAR_CAMERA_SOURCE:?Defina RAIAR_CAMERA_SOURCE no arquivo .env}
      RAIAR_CAMERA_ID: ${RAIAR_CAMERA_ID:-camera-1}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      YOLO_CONFIG_DIR: /cache/ultralytics
      MPLCONFIGDIR: /cache/matplotlib
      TORCH_HOME: /cache/torch
    # A fonte fica em RAIAR_CAMERA_SOURCE no ambiente para a futura captura ao vivo.
    command: ["--help"]
    volumes:
      - ${RAIAR_DATA:-/opt/raiar/data}:/app/outputs
      - /opt/raiar/models:/opt/raiar/models:ro
      - vision-cache:/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /frames:rw,noexec,nosuid,size=128m

  sync:
    image: raiar/vision:${RAIAR_TAG:-0.1.0}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      RAIAR_SYNC_URL: ${RAIAR_SYNC_URL:?Defina RAIAR_SYNC_URL no arquivo .env}
      RAIAR_SYNC_TOKEN: ${RAIAR_SYNC_TOKEN:?Defina RAIAR_SYNC_TOKEN no arquivo .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do \
          raiar-vision --root /app sync \
            --database /app/outputs/results.sqlite3 \
            --url "$${RAIAR_SYNC_URL}" \
            --token-env RAIAR_SYNC_TOKEN \
            --batch-size 100 || true
          sleep 300
        done
    volumes:
      - ${RAIAR_DATA:-/opt/raiar/data}:/app/outputs
      - vision-cache:/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

volumes:
  vision-cache:
