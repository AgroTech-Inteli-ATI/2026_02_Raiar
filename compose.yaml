services:
  vision:
    profiles: ["captura"]
    image: raiar/vision:${RAIAR_TAG:-0.1.0}
    build:
      context: .
      dockerfile: sprint-3/docker/chicken-yolo/Dockerfile
      args:
        MODELO: ${MODELO:-coco}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 3.2
    environment:
      RAIAR_CAMERA_SOURCE: ${RAIAR_CAMERA_SOURCE:?Defina RAIAR_CAMERA_SOURCE no arquivo .env}
      # Deve ser o camera.id cadastrado no banco (número); o sync usa esse valor para achar o aviário.
      RAIAR_CAMERA_ID: ${RAIAR_CAMERA_ID:-1}
      RAIAR_INTERVAL_SECONDS: ${RAIAR_INTERVAL_SECONDS:-5}
      RAIAR_LOTE_ID: ${RAIAR_LOTE_ID:-}
      # Arquivo de zonas da câmera (dentro de /app/config); vazio = contagem sem níveis.
      RAIAR_ZONES: ${RAIAR_ZONES:-}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      YOLO_CONFIG_DIR: /cache/ultralytics
      MPLCONFIGDIR: /cache/matplotlib
      TORCH_HOME: /cache/torch
    # Uma câmera vem de RAIAR_CAMERA_SOURCE; para várias, crie /opt/raiar/config/cameras.yaml.
    command: ["run", "--model", "${MODELO:-coco}"]
    volumes:
      - ${RAIAR_DATA:-/opt/raiar/data}:/app/outputs
      # Se existir config/cameras.yaml aqui, o `run` o usa no lugar de RAIAR_CAMERA_SOURCE.
      - ${RAIAR_CONFIG:-/opt/raiar/config}:/app/config:ro
      - /opt/raiar/models:/opt/raiar/models:ro
      - vision-cache:/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /frames:rw,noexec,nosuid,size=128m

  # Simulação do DVR: um servidor RTSP e um ffmpeg que repete um vídeo em loop como se fosse
  # uma câmera. Use com RAIAR_CAMERA_SOURCE=rtsp://dvr-sim:8554/camera1 e
  # `docker compose --profile captura --profile simulacao up`.
  dvr-sim:
    profiles: ["simulacao"]
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    mem_limit: 128m

  dvr-sim-feed:
    profiles: ["simulacao"]
    image: raiar/vision:${RAIAR_TAG:-0.1.0}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    environment:
      RAIAR_SIM_VIDEO: ${RAIAR_SIM_VIDEO:-WhatsApp Video 2026-09-29 at 12.02.03.mp4}
    entrypoint: ["/bin/sh", "-c"]
    # O vídeo é H.264, então `-c copy` publica sem recodificar e quase não usa CPU.
    command:
      - exec ffmpeg -loglevel warning -re -stream_loop -1 -i "/sim/$${RAIAR_SIM_VIDEO}" -c copy -f rtsp -rtsp_transport tcp rtsp://dvr-sim:8554/camera1
    volumes:
      - ${RAIAR_SIM_DIR:-./src/raiarnet/img}:/sim:ro

  sync:
    image: raiar/vision:${RAIAR_TAG:-0.1.0}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      RAIAR_SYNC_URL: ${RAIAR_SYNC_URL:?Defina RAIAR_SYNC_URL no arquivo .env}
      RAIAR_SYNC_TOKEN: ${RAIAR_SYNC_TOKEN:?Defina RAIAR_SYNC_TOKEN no arquivo .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do \
          raiar-vision --root /app sync \
            --database /app/outputs/results.sqlite3 \
            --url "$${RAIAR_SYNC_URL}" \
            --token-env RAIAR_SYNC_TOKEN \
            --batch-size 100 || true
          sleep 300
        done
    volumes:
      - ${RAIAR_DATA:-/opt/raiar/data}:/app/outputs
      - vision-cache:/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

volumes:
  vision-cache:
